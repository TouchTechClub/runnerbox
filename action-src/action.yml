# runnerbox composite action — RENDERED from this template by release.sh.
# Do not edit action.yml directly; edit this file and run ./release.sh to
# re-render with the sha256 of the release tarball.
name: runnerbox
description: Boot agent-device proxy + cloudflared tunnel on this macOS runner and register it with the runnerbox API.
branding:
  icon: box
  color: purple
inputs:
  token:
    description: RUNNERBOX_TOKEN repo secret, provisioned by runnerbox init.
    required: true
  api_url:
    description: runnerbox API base URL (override for staging).
    required: false
    default: "https://api.runnerbox.dpdns.org"
  version:
    description: Release tag of the runnerbox-agent tarball to download.
    required: false
    default: "v1"
runs:
  using: composite
  steps:
    - name: Run runnerbox-agent
      shell: bash
      env:
        RUNNERBOX_TOKEN: ${{ inputs.token }}
        RUNNERBOX_API_URL: ${{ inputs.api_url }}
      run: |
        set -euo pipefail
        TARBALL=runnerbox-agent-darwin-arm64.tar.gz
        curl -fsSL "https://github.com/TouchTechClub/runnerbox/releases/download/${{ inputs.version }}/$TARBALL" -o "$TARBALL"
        echo "4c854c886328a3761c160875e7943a8b81e20f7b25dc554c079b2d89918c0ce7  $TARBALL" | shasum -a 256 -c -
        tar xzf "$TARBALL"
        chmod +x ./runnerbox-agent
        ./runnerbox-agent
