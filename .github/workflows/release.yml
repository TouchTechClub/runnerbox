name: Release

# One tag does everything:
#   git tag v0.2.0 && git push origin v0.2.0
#
# jobs:
#   quality   — typecheck + lint gate
#   agent     — build runnerbox-agent (macOS), upload tarball to this repo's
#               GitHub Release, re-render action.yml with its sha256
#   deploy    — alchemy deploy (D1 migrations + worker + web) to Cloudflare
#   cli       — npm publish with provenance (trusted publishing, no token)
#   runner    — update TouchTechClub/runner action.yml + retag v1

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  quality:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check

  # ---- runnerbox-agent binary → GitHub Release (sha256-pinned) ----
  agent:
    needs: [preflight, quality]
    runs-on: macos-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build agent
        run: bun run --cwd packages/agent build
      - name: Package tarball + sha256
        id: pkg
        run: |
          cp packages/agent/dist/runnerbox-agent-darwin-arm64 ./runnerbox-agent
          tar czf runnerbox-agent-darwin-arm64.tar.gz runnerbox-agent
          echo "sha256=$(shasum -a 256 runnerbox-agent-darwin-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Render action.yml with pinned sha
        run: |
          sed "s/{{SHA256}}/${{ steps.pkg.outputs.sha256 }}/" \
            action-src/action.yml.template > action-src/action.yml
          cp action-src/action.yml runner-action.yml
      - name: Upload tarball to GitHub Release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "runnerbox $TAG" --generate-notes
          gh release upload "$TAG" runnerbox-agent-darwin-arm64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit rendered action.yml back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action-src/action.yml
          git diff --cached --quiet || {
            git commit -m "release: action.yml sha256 for $TAG"
            git push origin HEAD:main
          }
      - name: Upload rendered action.yml for runner job
        uses: actions/upload-artifact@v4
        with:
          name: runner-action
          path: runner-action.yml
          retention-days: 1

  # ---- deploy API + web + D1/KV via alchemy ----
  deploy:
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
      # app env — secrets
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
      GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      # vars
      APP_URL: ${{ vars.APP_URL }}
      DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # alchemy state is stored in a hosted state-store worker; its creds are a
      # static secret seeded into ~/.alchemy (same pattern as s5code relay).
      - name: Seed alchemy state-store credentials
        run: |
          mkdir -p ~/.alchemy/credentials/default ~/.alchemy/profiles
          printf '%s' "$ALCHEMY_STATE_STORE_CREDENTIALS" \
            > ~/.alchemy/credentials/default/cloudflare-state-store.json
          printf '%s' '{"version":0,"profiles":{"default":{"Cloudflare":{"method":"env"}}}}' \
            > ~/.alchemy/profiles.json
        env:
          ALCHEMY_STATE_STORE_CREDENTIALS: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}
      - name: Deploy
        run: cd packages/infra && bunx alchemy deploy --yes
      - name: Publish deploy status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: "${{ job.status }}",
              context: "deploy / production",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # ---- npm publish (trusted publishing, no token) ----
  cli:
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # npm ≥11.5.1 required for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Sync CLI version to release
        run: |
          cd apps/cli
          npm version "${{ needs.preflight.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: bun run --cwd apps/cli build
      - name: Publish
        run: cd apps/cli && npm publish --provenance --access public
      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cli/package.json
          git diff --cached --quiet || {
            git commit -m "release(cli): v${{ needs.preflight.outputs.version }}"
            git push origin HEAD:main
          }

  # ---- update the public composite action ----
  # Uses OUR GitHub App (installed on TouchTechClub/runner) to mint an
  # installation token — no PAT needed. One-time: install the app on the
  # runner repo (contents:write covers pushes).
  runner:
    needs: [preflight, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runner-action
      - uses: actions/create-github-app-token@v2
        id: runner-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: TouchTechClub
          repositories: runner
      - name: Push action.yml to TouchTechClub/runner + retag v1
        env:
          GH_TOKEN: ${{ steps.runner-token.outputs.token }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/TouchTechClub/runner.git runner-repo
          cp runner-action.yml runner-repo/action.yml
          cd runner-repo
          git config user.name "runnerbox-ci"
          git config user.email "ci@runnerbox.dpdns.org"
          git add action.yml
          git diff --cached --quiet && echo "action.yml unchanged" && exit 0
          git commit -m "release: ${{ needs.preflight.outputs.tag }} (sha256 ${{ github.sha }})"
          git push origin main
          git tag -f v1 && git push -f origin v1
