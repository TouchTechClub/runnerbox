<!doctype html>
<html><body>
<p>Creating the runnerbox GitHub App… (auto-submitting)</p>
<form id="f" method="post" action="https://github.com/settings/apps/new">
  <input type="hidden" name="manifest" id="m">
</form>
<script>
const manifest = {
  "name": "runnerbox",
  "url": "https://runnerbox.dpdns.org",
  "description": "Boot free iOS simulators & Android emulators on your own GitHub Actions minutes, exposed to your machine as an `agent-device` remote proxy.\n\n**Install this app on a NEW, EMPTY repository only.** RunnerBox commits a workflow file and writes a secret to the repo — a dedicated repo keeps your real projects clean and avoids surprises on protected branches.",
  "hook_attributes": {
    "url": "https://api.runnerbox.dpdns.org/webhooks/github",
    "active": true
  },
  "redirect_url": "https://api.runnerbox.dpdns.org/healthz",
  "callback_urls": ["https://api.runnerbox.dpdns.org/api/auth/callback/github"],
  "setup_url": "https://runnerbox.dpdns.org/onboarding",
  "setup_on_update": true,
  "public": true,
  "default_permissions": {
    "contents": "write",
    "actions": "write",
    "secrets": "write",
    "metadata": "read"
  },
  "default_events": ["workflow_run"],
  "request_oauth_on_install": true
};
document.getElementById("m").value = JSON.stringify(manifest);
document.getElementById("f").submit();
</script>
</body></html>
